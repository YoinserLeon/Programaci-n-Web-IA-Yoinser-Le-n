<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500 selection:text-white">

        <!-- Tablero de Juego (3x3) -->
        <div id="board" class="grid grid-cols-3 gap-3 w-full aspect-square bg-slate-950/70 p-3 rounded-3xl border border-slate-800 mb-6 shadow-inner">

            <button class="cell cell-hover flex items-center justify-center bg-slate-800/80 rounded-2xl text-4xl sm:text-5xl font-extrabold transition-all duration-150 border border-slate-700/60 shadow-sm" data-index="7"></button>
            <button class="cell cell-hover flex items-center justify-center bg-slate-800/80 rounded-2xl text-4xl sm:text-5xl font-extrabold transition-all duration-150 border border-slate-700/60 shadow-sm" data-index="8"></button>

        <!-- Controles de Acción -->

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>

            <button id="btn-reset-scores" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-2xl border border-slate-700 transition duration-200" title="Reiniciar Marcadores">

    <!-- Modal de Victoria / Empate -->
    <div id="modal-result" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform transition-all scale-95 animate-pulse-slow">
            <div id="modal-icon" class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-black">
                🎉
            </div>
            <h2 id="modal-title" class="text-2xl font-black text-white mb-2">¡Victoria!</h2>
            <p id="modal-message" class="text-slate-300 text-sm mb-6">El Jugador X ha ganado la partida.</p>
            <button id="modal-btn-play" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-2xl shadow-lg transition transform active:scale-95">
                Jugar de nuevo
            </button>
        </div>
    </div>

    <!-- LÓGICA CON PROGRAMACIÓN ORIENTADA A OBJETOS (POO) -->
    <script>
        /**
         * CLASE AUDIO EFFECTS (Sintetizador Web Audio API)
         * Provee retroalimentación sonora sin requerir archivos externos.
         */
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.audioCtx = null;
            }

            initContext() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                }
            }

            playTone(freq, type = 'sine', duration = 0.1, delay = 0) {
                if (!this.enabled) return;
                try {
                    this.initContext();
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime + delay);

                    gain.gain.setValueAtTime(0.15, this.audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + delay + duration);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    osc.start(this.audioCtx.currentTime + delay);
                    osc.stop(this.audioCtx.currentTime + delay + duration);
                } catch (e) {
                    // Silencio seguro si las políticas de autoplay restringen el audio
                }
            }

            playMove(symbol) {
                if (symbol === 'X') {
                    this.playTone(520, 'triangle', 0.08);
                } else {
                    this.playTone(380, 'sine', 0.08);
                }
            }

            playWin() {
                this.playTone(523.25, 'triangle', 0.12, 0);      // C5
                this.playTone(659.25, 'triangle', 0.12, 0.12);   // E5
                this.playTone(783.99, 'triangle', 0.25, 0.24);   // G5
            }

            playDraw() {
                this.playTone(330, 'sawtooth', 0.12, 0);
                this.playTone(280, 'sawtooth', 0.2, 0.12);
            }

            toggle() {
                this.enabled = !this.enabled;
                return this.enabled;
            }
        }

        /**
         * CLASE BOARD (Tablero de Juego)
         * Modela el estado de la cuadrícula de 3x3 y calcula las condiciones de victoria.
         */
        class Board {
            constructor() {
                this.cells = Array(9).fill(null);
                this.winningCombinations = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // Filas
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columnas
                    [0, 4, 8], [2, 4, 6]             // Diagonales
                ];
            }

            reset() {
                this.cells = Array(9).fill(null);
            }

            makeMove(index, symbol) {
                if (this.isValidMove(index)) {
                    this.cells[index] = symbol;
                    return true;
                }
                return false;
            }

            isValidMove(index) {
                return this.cells[index] === null && index >= 0 && index < 9;
            }

            getAvailableMoves() {
                const moves = [];
                this.cells.forEach((cell, index) => {
                    if (cell === null) moves.push(index);
                });
                return moves;
            }

            isFull() {
                return this.cells.every(cell => cell !== null);
            }

            checkWin() {
                for (const combination of this.winningCombinations) {
                    const [a, b, c] = combination;
                    if (
                        this.cells[a] &&
                        this.cells[a] === this.cells[b] &&
                        this.cells[a] === this.cells[c]
                    ) {
                        return { winner: this.cells[a], combination };
                    }
                }
                return null;
            }

            isTerminal() {
                const win = this.checkWin();
                if (win) return { terminal: true, winner: win.winner, combination: win.combination };
                if (this.isFull()) return { terminal: true, winner: null, isDraw: true };
                return { terminal: false };
            }
        }

        /**
         * CLASE BASE PLAYER (Jugador)
         */
        class Player {
            constructor(name, symbol, isAI = false) {
                this.name = name;
                this.symbol = symbol;
                this.isAI = isAI;
            }
        }

        /**
         * CLASE AIPlayer (Inteligencia Artificial con Algoritmo Minimax)
         * Hereda de Player.
         */
        class AIPlayer extends Player {
            constructor(name, symbol, difficulty = 'hard') {
                super(name, symbol, true);
                this.difficulty = difficulty; // 'easy' o 'hard'
                this.opponentSymbol = symbol === 'X' ? 'O' : 'X';
            }

            setDifficulty(diff) {
                this.difficulty = diff;
            }

            getMove(board) {
                const availableMoves = board.getAvailableMoves();
                if (availableMoves.length === 0) return null;

                // Si la dificultad es fácil, juega al azar
                if (this.difficulty === 'easy') {
                    const randomIndex = Math.floor(Math.random() * availableMoves.length);
                    return availableMoves[randomIndex];
                }

                // Dificultad difícil: Minimax
                return this.getBestMove(board);
            }

            getBestMove(board) {
                let bestScore = -Infinity;
                let move = null;
                const availableMoves = board.getAvailableMoves();

                for (const idx of availableMoves) {
                    board.cells[idx] = this.symbol;
                    const score = this.minimax(board, 0, false);
                    board.cells[idx] = null;

                    if (score > bestScore) {
                        bestScore = score;
                        move = idx;
                    }
                }
                return move;
            }

            minimax(board, depth, isMaximizing) {
                const terminalState = board.isTerminal();
                if (terminalState.terminal) {
                    if (terminalState.winner === this.symbol) return 10 - depth;
                    if (terminalState.winner === this.opponentSymbol) return depth - 10;
                    return 0; // Empate
                }

                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (const move of board.getAvailableMoves()) {
                        board.cells[move] = this.symbol;
                        const evaluation = this.minimax(board, depth + 1, false);
                        board.cells[move] = null;
                        maxEval = Math.max(maxEval, evaluation);
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (const move of board.getAvailableMoves()) {
                        board.cells[move] = this.opponentSymbol;
                        const evaluation = this.minimax(board, depth + 1, true);
                        board.cells[move] = null;
                        minEval = Math.min(minEval, evaluation);
                    }
                    return minEval;
                }
            }
        }

        /**
         * CLASE UIManager (Interfaz de Usuario)
         * Encapsula todas las manipulaciones del DOM y estilos de Tailwind CSS.
         */
        class UIManager {
            constructor() {
                this.cellButtons = Array.from(document.querySelectorAll('.cell'));
                this.statusText = document.getElementById('status-text');
                this.turnDot = document.getElementById('turn-dot');
                this.scoreX = document.getElementById('score-x');
                this.scoreO = document.getElementById('score-o');
                this.scoreTies = document.getElementById('score-ties');
                this.playerOLabel = document.getElementById('player-o-label');

                this.modalResult = document.getElementById('modal-result');
                this.modalTitle = document.getElementById('modal-title');
                this.modalMessage = document.getElementById('modal-message');
                this.modalIcon = document.getElementById('modal-icon');
                this.modalBtnPlay = document.getElementById('modal-btn-play');

                this.btnSound = document.getElementById('btn-sound');
                this.iconSound = document.getElementById('icon-sound');
                this.modeButtons = {
                    'pvp': document.getElementById('mode-pvp'),
                    'easy': document.getElementById('mode-ai-easy'),
                    'hard': document.getElementById('mode-ai-hard')
                };
            }

            renderBoard(board) {
                board.cells.forEach((symbol, index) => {
                    const btn = this.cellButtons[index];
                    btn.innerHTML = '';
                    if (symbol === 'X') {
                        btn.innerHTML = `<span class="text-cyan-400 symbol-pop drop-shadow-[0_0_12px_rgba(34,211,238,0.5)]">X</span>`;
                        btn.disabled = true;
                    } else if (symbol === 'O') {
                        btn.innerHTML = `<span class="text-rose-400 symbol-pop drop-shadow-[0_0_12px_rgba(251,113,133,0.5)]">O</span>`;
                        btn.disabled = true;
                    } else {
                        btn.disabled = false;
                        btn.classList.remove('bg-emerald-900/40', 'border-emerald-500/80', 'animate-pulse');
                    }
                });
            }

            highlightWinningCells(combination) {
                combination.forEach(index => {
                    const btn = this.cellButtons[index];
                    btn.classList.add('bg-emerald-900/50', 'border-emerald-400', 'shadow-[0_0_20px_rgba(52,211,153,0.4)]');
                });
            }

            disableAllCells() {
                this.cellButtons.forEach(btn => btn.disabled = true);
            }

            updateStatus(currentPlayer, isGameOver = false) {
                if (isGameOver) return;

                if (currentPlayer.symbol === 'X') {
                    this.turnDot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)]';
                    this.statusText.innerHTML = `Turno de: <strong class="text-cyan-400 font-bold">${currentPlayer.name} (X)</strong>`;
                } else {
                    this.turnDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-400 shadow-[0_0_8px_rgba(251,113,133,0.8)]';
                    this.statusText.innerHTML = `Turno de: <strong class="text-rose-400 font-bold">${currentPlayer.name} (O)</strong>`;
                }
            }

            updateScores(scores) {
                this.scoreX.textContent = scores.X;
                this.scoreO.textContent = scores.O;
                this.scoreTies.textContent = scores.ties;
            }

            updatePlayerLabels(mode) {
                if (mode === 'pvp') {
                    this.playerOLabel.textContent = 'O (Jugador 2)';
                } else if (mode === 'easy') {
                    this.playerOLabel.textContent = 'O (IA Fácil)';
                } else {
                    this.playerOLabel.textContent = 'O (IA Invencible)';
                }
            }

            updateActiveModeButton(activeMode) {
                Object.entries(this.modeButtons).forEach(([key, btn]) => {
                    if (key === activeMode) {
                        btn.className = "mode-btn py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 bg-cyan-600 text-white shadow-md shadow-cyan-900/40";
                    } else {
                        btn.className = "mode-btn py-2 px-3 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:text-white transition-all duration-200";
                    }
                });
            }

            showModal(result, winnerPlayer = null) {
                if (result === 'win') {
                    const isX = winnerPlayer.symbol === 'X';
                    this.modalIcon.innerHTML = isX ? '⚡' : '🤖';
                    this.modalIcon.className = isX 
                        ? 'w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-black bg-cyan-950/80 text-cyan-400 border border-cyan-800'
                        : 'w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-black bg-rose-950/80 text-rose-400 border border-rose-800';
                    this.modalTitle.textContent = `¡Victoria de ${winnerPlayer.name}!`;
                    this.modalMessage.textContent = `Ha completado 3 en raya con el símbolo [${winnerPlayer.symbol}].`;
                } else {
                    this.modalIcon.innerHTML = '🤝';
                    this.modalIcon.className = 'w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-black bg-slate-800 text-slate-300 border border-slate-700';
                    this.modalTitle.textContent = '¡Empate!';
                    this.modalMessage.textContent = 'Gran partida, ninguno logró conectar tres en raya.';
                }
                this.modalResult.classList.remove('hidden');
            }

            hideModal() {
                this.modalResult.classList.add('hidden');
            }

            updateSoundIcon(enabled) {
                if (enabled) {
                    this.iconSound.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>`;
                    this.btnSound.classList.remove('text-slate-600');
                    this.btnSound.classList.add('text-slate-400');
                } else {
                    this.iconSound.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
                    this.btnSound.classList.add('text-slate-600');
                    this.btnSound.classList.remove('text-slate-400');
                }
            }
        }

        /**
         * CLASE TicTacToeGame (Controlador Principal del Juego)
         * Orquesta las clases Board, Player, AIPlayer, UIManager y SoundFX.
         */
        class TicTacToeGame {
            constructor() {
                this.board = new Board();
                this.ui = new UIManager();
                this.sound = new SoundFX();

                this.mode = 'pvp'; // 'pvp', 'easy', 'hard'
                this.scores = { X: 0, O: 0, ties: 0 };
                this.isGameOver = false;

                this.playerX = new Player('Jugador 1', 'X');
                this.playerO = new Player('Jugador 2', 'O');
                this.currentPlayer = this.playerX;

                this.initEventListeners();
                this.startNewGame();
            }

            initEventListeners() {
                // Eventos de click en las celdas
                this.ui.cellButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.currentTarget.getAttribute('data-index'));
                        this.handleCellClick(index);
                    });
                });

                // Reiniciar ronda
                document.getElementById('btn-restart').addEventListener('click', () => {
                    this.startNewGame();
                });

                // Reiniciar marcadores
                document.getElementById('btn-reset-scores').addEventListener('click', () => {
                    this.resetScores();
                });

                // Botón jugar de nuevo en modal
                this.ui.modalBtnPlay.addEventListener('click', () => {
                    this.ui.hideModal();
                    this.startNewGame();
                });

                // Toggle Sonido
                this.ui.btnSound.addEventListener('click', () => {
                    const isMuted = !this.sound.toggle();
                    this.ui.updateSoundIcon(!isMuted);
                });

                // Selector de Modos
                this.ui.modeButtons['pvp'].addEventListener('click', () => this.switchMode('pvp'));
                this.ui.modeButtons['easy'].addEventListener('click', () => this.switchMode('easy'));
                this.ui.modeButtons['hard'].addEventListener('click', () => this.switchMode('hard'));
            }

            switchMode(mode) {
                if (this.mode === mode) return;
                this.mode = mode;
                this.ui.updateActiveModeButton(mode);
                this.ui.updatePlayerLabels(mode);

                if (mode === 'pvp') {
                    this.playerO = new Player('Jugador 2', 'O');
                } else {
                    this.playerO = new AIPlayer(mode === 'easy' ? 'IA Fácil' : 'IA Experta', 'O', mode);
                }

                this.resetScores();
                this.startNewGame();
            }

            resetScores() {
                this.scores = { X: 0, O: 0, ties: 0 };
                this.ui.updateScores(this.scores);
            }

            startNewGame() {
                this.board.reset();
                this.isGameOver = false;
                this.currentPlayer = this.playerX;
                this.ui.renderBoard(this.board);
                this.ui.updateStatus(this.currentPlayer);
            }

            handleCellClick(index) {
                if (this.isGameOver || !this.board.isValidMove(index)) return;

                // Movimiento del jugador actual
                this.executeMove(index);

                // Si es modo IA y le toca a la máquina y el juego no ha terminado
                if (!this.isGameOver && this.currentPlayer.isAI) {
                    this.ui.disableAllCells();
                    setTimeout(() => {
                        const aiMove = this.currentPlayer.getMove(this.board);
                        if (aiMove !== null) {
                            this.executeMove(aiMove);
                        }
                    }, 400); // Pequeña pausa natural para la IA
                }
            }

            executeMove(index) {
                const moved = this.board.makeMove(index, this.currentPlayer.symbol);
                if (!moved) return;

                this.sound.playMove(this.currentPlayer.symbol);
                this.ui.renderBoard(this.board);

                // Comprobar estado del juego
                const terminalState = this.board.isTerminal();

                if (terminalState.terminal) {
                    this.isGameOver = true;
                    if (terminalState.winner) {
                        this.scores[terminalState.winner]++;
                        this.sound.playWin();
                        this.ui.highlightWinningCells(terminalState.combination);
                        this.ui.updateScores(this.scores);
                        setTimeout(() => this.ui.showModal('win', this.currentPlayer), 500);
                    } else {
                        this.scores.ties++;
                        this.sound.playDraw();
                        this.ui.updateScores(this.scores);
                        setTimeout(() => this.ui.showModal('draw'), 400);
                    }
                    return;
                }

                // Alternar turno
                this.currentPlayer = (this.currentPlayer === this.playerX) ? this.playerO : this.playerX;
                this.ui.updateStatus(this.currentPlayer);
            }
        }

        // Inicialización al cargar el DOM
        document.addEventListener('DOMContentLoaded', () => {
            const game = new TicTacToeGame();
        });
    </script>
</body>
</html>
