<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cinexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0712" />
      <stop offset="50%" stop-color="#140f24" />
      <stop offset="100%" stop-color="#241108" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1832" />
      <stop offset="100%" stop-color="#0e0a18" />
    </linearGradient>
    <linearGradient id="poster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="poster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="poster3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#cinexBg)" />

  <!-- Glowing background orb -->
  <circle cx="650" cy="120" r="180" fill="#f59e0b" opacity="0.08" filter="blur(40px)" />
  <circle cx="150" cy="380" r="140" fill="#ea580c" opacity="0.06" filter="blur(30px)" />

  <!-- Browser Frame -->
  <rect x="60" y="30" width="680" height="440" rx="14" fill="#0d0a14" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.7))" />

  <!-- Navbar -->
  <rect x="60" y="30" width="680" height="45" rx="14" fill="#151122" />
  <rect x="60" y="60" width="680" height="15" fill="#151122" />
  
  <!-- Window Controls -->
  <circle cx="85" cy="52" r="5" fill="#ef4444" />
  <circle cx="102" cy="52" r="5" fill="#f59e0b" />
  <circle cx="119" cy="52" r="5" fill="#10b981" />

  <!-- Cinex Brand -->
  <text x="160" y="57" font-family="sans-serif" font-weight="900" font-size="16" fill="#f59e0b">CINEX</text>
  <text x="215" y="57" font-family="sans-serif" font-weight="bold" font-size="11" fill="#e2e8f0">Películas</text>
  <text x="275" y="57" font-family="sans-serif" font-size="11" fill="#94a3b8">Estrenos</text>
  <text x="335" y="57" font-family="sans-serif" font-size="11" fill="#94a3b8">Categorías</text>

  <!-- Search bar in navbar -->
  <rect x="520" y="42" width="160" height="22" rx="11" fill="#241e34" />
  <text x="540" y="56" font-family="sans-serif" font-size="9" fill="#94a3b8">Buscar película...</text>

  <!-- Hero Movie Banner -->
  <rect x="85" y="90" width="630" height="180" rx="12" fill="url(#heroCardGrad)" stroke="#382952" stroke-width="1" />
  
  <!-- Hero Glow & Visual elements -->
  <rect x="85" y="90" width="350" height="180" rx="12" fill="#000000" opacity="0.4" />
  
  <!-- Featured Badge -->
  <rect x="110" y="110" width="105" height="20" rx="10" fill="url(#amberGold)" />
  <text x="162" y="124" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0f172a" text-anchor="middle">★ DESTACADA DE LA SEMANA</text>

  <text x="110" y="158" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff">INTERSTELLAR: ODYSSEY</text>
  <text x="110" y="180" font-family="sans-serif" font-size="11" fill="#cbd5e1">Ciencia Ficción • 2h 49min • 4K Ultra HD • 2026</text>
  <text x="110" y="198" font-family="sans-serif" font-size="10" fill="#94a3b8">Una travesía espacial más allá de los límites del conocimiento humano.</text>

  <!-- Play Button -->
  <rect x="110" y="218" width="125" height="34" rx="17" fill="url(#amberGold)" />
  <polygon points="130,229 130,241 142,235" fill="#0f172a" />
  <text x="175" y="239" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">Ver Tráiler</text>

  <rect x="245" y="218" width="115" height="34" rx="17" fill="#241e34" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
  <text x="302" y="239" font-family="sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">+ Mi Lista</text>

  <!-- Reel Graphic on Right of Hero -->
  <circle cx="600" cy="180" r="60" fill="#1b1429" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" />
  <polygon points="595,165 595,195 620,180" fill="#f59e0b" />

  <!-- Section: Cartelera -->
  <text x="85" y="300" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Cartelera en Tendencia</text>
  <text x="675" y="300" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="end">Ver todas →</text>

  <!-- Movie Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(85, 315)">
    <rect width="140" height="135" rx="8" fill="url(#poster1)" stroke="#382952" stroke-width="1" />
    <rect y="95" width="140" height="40" rx="8" fill="#0c0914" opacity="0.9" />
    <text x="10" y="112" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f8fafc">Cyber Runner</text>
    <text x="10" y="126" font-family="sans-serif" font-size="8" fill="#f59e0b">★ 4.9 • Acción</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(245, 315)">
    <rect width="140" height="135" rx="8" fill="url(#poster2)" stroke="#382952" stroke-width="1" />
    <rect y="95" width="140" height="40" rx="8" fill="#0c0914" opacity="0.9" />
    <text x="10" y="112" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f8fafc">Solaris Pulse</text>
    <text x="10" y="126" font-family="sans-serif" font-size="8" fill="#f59e0b">★ 4.8 • Suspenso</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(405, 315)">
    <rect width="140" height="135" rx="8" fill="url(#poster3)" stroke="#382952" stroke-width="1" />
    <rect y="95" width="140" height="40" rx="8" fill="#0c0914" opacity="0.9" />
    <text x="10" y="112" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f8fafc">Dune Horizons</text>
    <text x="10" y="126" font-family="sans-serif" font-size="8" fill="#f59e0b">★ 4.7 • Aventura</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(565, 315)">
    <rect width="150" height="135" rx="8" fill="#1b1429" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <rect y="95" width="150" height="40" rx="8" fill="#0c0914" opacity="0.9" />
    <text x="10" y="112" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f8fafc">Apex Odyssey</text>
    <text x="10" y="126" font-family="sans-serif" font-size="8" fill="#f59e0b">★ 4.9 • Sci-Fi</text>
  </g>
</svg>
