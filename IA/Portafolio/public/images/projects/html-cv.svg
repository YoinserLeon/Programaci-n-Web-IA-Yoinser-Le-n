<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e" />
      <stop offset="50%" stop-color="#141c2b" />
      <stop offset="100%" stop-color="#1e1810" />
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192231" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#cvBg)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- CV Document Card Mockup -->
  <rect x="120" y="40" width="560" height="420" rx="16" fill="url(#paperGrad)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />

  <!-- Top Window Header -->
  <rect x="120" y="40" width="560" height="38" rx="16" fill="#0f1723" />
  <rect x="120" y="62" width="560" height="16" fill="#0f1723" />
  <circle cx="145" cy="59" r="5" fill="#ef4444" />
  <circle cx="162" cy="59" r="5" fill="#f59e0b" />
  <circle cx="179" cy="59" r="5" fill="#10b981" />
  <text x="400" y="63" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">cv-profesional.html</text>

  <!-- Sidebar inside Document -->
  <rect x="140" y="95" width="160" height="345" rx="10" fill="#0c121b" stroke="#334155" stroke-width="0.5" />
  
  <!-- Profile Picture placeholder -->
  <circle cx="220" cy="155" r="38" fill="url(#warmAmber)" />
  <circle cx="220" cy="155" r="35" fill="#1e293b" />
  <text x="220" y="161" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fbbf24" text-anchor="middle">YL</text>

  <!-- Name & Title in sidebar -->
  <text x="220" y="212" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f8fafc" text-anchor="middle">Yoinser León</text>
  <text x="220" y="228" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Full-Stack Developer</text>

  <!-- Sidebar Skill bars -->
  <text x="155" y="260" font-family="sans-serif" font-weight="bold" font-size="10" fill="#94a3b8">HABILIDADES</text>
  
  <text x="155" y="280" font-family="sans-serif" font-size="9" fill="#cbd5e1">HTML5 / CSS3</text>
  <rect x="155" y="287" width="130" height="5" rx="2.5" fill="#1e293b" />
  <rect x="155" y="287" width="120" height="5" rx="2.5" fill="url(#warmAmber)" />

  <text x="155" y="310" font-family="sans-serif" font-size="9" fill="#cbd5e1">JavaScript</text>
  <rect x="155" y="317" width="130" height="5" rx="2.5" fill="#1e293b" />
  <rect x="155" y="317" width="115" height="5" rx="2.5" fill="url(#warmAmber)" />

  <text x="155" y="340" font-family="sans-serif" font-size="9" fill="#cbd5e1">Diseño Web</text>
  <rect x="155" y="347" width="130" height="5" rx="2.5" fill="#1e293b" />
  <rect x="155" y="347" width="110" height="5" rx="2.5" fill="url(#warmAmber)" />

  <!-- Main Content of CV -->
  <!-- Header Banner -->
  <rect x="320" y="95" width="340" height="75" rx="10" fill="#141e2e" stroke="#f59e0b" stroke-opacity="0.2" />
  <text x="338" y="125" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff">CURRÍCULUM VITAE</text>
  <text x="338" y="145" font-family="sans-serif" font-size="11" fill="#f59e0b">Desarrollador Web Frontend &amp; Backend</text>
  <circle cx="630" cy="132" r="16" fill="url(#warmAmber)" opacity="0.2" />
  <text x="630" y="137" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f59e0b" text-anchor="middle">&lt;/&gt;</text>

  <!-- Section: Perfil Profesional -->
  <text x="320" y="200" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fbbf24">PERFIL PROFESIONAL</text>
  <line x1="320" y1="207" x2="660" y2="207" stroke="#334155" stroke-width="1" />
  <rect x="320" y="217" width="330" height="6" rx="3" fill="#334155" opacity="0.6" />
  <rect x="320" y="229" width="300" height="6" rx="3" fill="#334155" opacity="0.6" />
  <rect x="320" y="241" width="240" height="6" rx="3" fill="#334155" opacity="0.4" />

  <!-- Section: Experiencia y Proyectos -->
  <text x="320" y="278" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fbbf24">PROYECTOS &amp; FORMACIÓN</text>
  <line x1="320" y1="285" x2="660" y2="285" stroke="#334155" stroke-width="1" />
  
  <!-- Project Item 1 -->
  <circle cx="326" cy="305" r="4" fill="#f59e0b" />
  <text x="338" y="308" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Desarrollo Web Full-Stack</text>
  <text x="660" y="308" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">2026</text>
  <rect x="338" y="318" width="310" height="5" rx="2.5" fill="#334155" opacity="0.6" />
  <rect x="338" y="328" width="270" height="5" rx="2.5" fill="#334155" opacity="0.4" />

  <!-- Project Item 2 -->
  <circle cx="326" cy="355" r="4" fill="#f59e0b" />
  <text x="338" y="358" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Arquitectura &amp; Maquetación HTML Semántica</text>
  <text x="660" y="358" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">2026</text>
  <rect x="338" y="368" width="300" height="5" rx="2.5" fill="#334155" opacity="0.6" />
  <rect x="338" y="378" width="220" height="5" rx="2.5" fill="#334155" opacity="0.4" />

  <!-- Badges at bottom -->
  <rect x="320" y="405" width="60" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.7" />
  <text x="350" y="419" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">HTML5</text>
  
  <rect x="390" y="405" width="55" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.7" />
  <text x="417" y="419" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">CSS3</text>

  <rect x="455" y="405" width="80" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.7" />
  <text x="495" y="419" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Semántica</text>
</svg>
