<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#110d1c" />
      <stop offset="100%" stop-color="#211005" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Arcade Canvas Outer Frame -->
  <rect width="800" height="500" fill="url(#gameBg)" />

  <!-- Canvas Screen -->
  <rect x="70" y="35" width="660" height="430" rx="16" fill="#08080f" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.8))" />

  <!-- Scanlines effect -->
  <g opacity="0.05" stroke="#f59e0b" stroke-width="1">
    <line x1="70" y1="70" x2="730" y2="70" />
    <line x1="70" y1="110" x2="730" y2="110" />
    <line x1="70" y1="150" x2="730" y2="150" />
    <line x1="70" y1="190" x2="730" y2="190" />
    <line x1="70" y1="230" x2="730" y2="230" />
    <line x1="70" y1="270" x2="730" y2="270" />
    <line x1="70" y1="310" x2="730" y2="310" />
    <line x1="70" y1="350" x2="730" y2="350" />
    <line x1="70" y1="390" x2="730" y2="390" />
    <line x1="70" y1="430" x2="730" y2="430" />
  </g>

  <!-- HUD Bar -->
  <rect x="70" y="35" width="660" height="50" rx="16" fill="#13111f" />
  <rect x="70" y="65" width="660" height="20" fill="#13111f" />
  <line x1="70" y1="85" x2="730" y2="85" stroke="#332d4a" stroke-width="1" />

  <!-- HUD Items -->
  <text x="100" y="67" font-family="monospace" font-weight="900" font-size="14" fill="#94a3b8">PUNTAJE: <tspan fill="#f59e0b">034,580</tspan></text>
  <text x="320" y="67" font-family="monospace" font-weight="bold" font-size="14" fill="#94a3b8">NIVEL: <tspan fill="#38bdf8">04</tspan></text>
  <text x="500" y="67" font-family="monospace" font-weight="bold" font-size="14" fill="#94a3b8">VIDAS: <tspan fill="#ef4444">❤❤❤</tspan></text>
  <circle cx="690" cy="62" r="8" fill="#10b981" filter="drop-shadow(0 0 5px #10b981)" />

  <!-- Stars in Game space -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="1.5" opacity="0.6" />
    <circle cx="210" cy="220" r="1.2" opacity="0.8" />
    <circle cx="350" cy="130" r="2" opacity="0.5" />
    <circle cx="580" cy="180" r="1.5" opacity="0.7" />
    <circle cx="660" cy="280" r="1.2" opacity="0.6" />
    <circle cx="290" cy="360" r="1.8" opacity="0.9" />
  </g>

  <!-- Enemies / Asteroids / Targets -->
  <!-- Asteroid 1 -->
  <g transform="translate(180, 160)">
    <polygon points="0,-25 22,-14 26,12 8,24 -22,18 -26,-8" fill="#2d1d14" stroke="#ea580c" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#ea580c" opacity="0.2" />
  </g>
  <!-- Asteroid 2 (Exploding) -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" opacity="0.2" filter="blur(6px)" />
    <polygon points="-8,-18 12,-12 24,6 8,16 -16,10 -20,-6" fill="#3b2011" stroke="#f59e0b" stroke-width="2" />
    <!-- Explosion sparks -->
    <line x1="-30" y1="-25" x2="-15" y2="-12" stroke="#fbbf24" stroke-width="2" />
    <line x1="28" y1="-20" x2="16" y2="-8" stroke="#f59e0b" stroke-width="2" />
    <line x1="30" y1="20" x2="14" y2="10" stroke="#ea580c" stroke-width="2" />
    <text x="35" y="-15" font-family="monospace" font-weight="900" font-size="12" fill="#fbbf24">+200</text>
  </g>
  <!-- Asteroid 3 -->
  <g transform="translate(600, 190)">
    <polygon points="0,-30 25,-18 30,14 10,28 -25,20 -30,-10" fill="#261b36" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Lasers Fired from Ship -->
  <rect x="394" y="220" width="4" height="40" rx="2" fill="url(#laserGrad)" filter="drop-shadow(0 0 8px #f59e0b)" />
  <rect x="402" y="220" width="4" height="40" rx="2" fill="url(#laserGrad)" filter="drop-shadow(0 0 8px #f59e0b)" />

  <!-- Player Spaceship -->
  <g transform="translate(400, 360)">
    <!-- Engine Fire -->
    <polygon points="-6,25 0,45 6,25" fill="#f97316" filter="drop-shadow(0 0 10px #f97316)" />
    <polygon points="-3,25 0,38 3,25" fill="#fef08a" />
    
    <!-- Ship Hull -->
    <polygon points="0,-35 24,20 12,24 0,16 -12,24 -24,20" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <!-- Wings detail -->
    <polygon points="0,-15 16,16 0,8 -16,16" fill="url(#neonOrange)" />
    <!-- Cockpit -->
    <ellipse cx="0" cy="-5" rx="4" ry="10" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)" />
  </g>

  <!-- Game Controls Overlay at bottom -->
  <g transform="translate(250, 420)">
    <rect width="300" height="30" rx="15" fill="#171524" stroke="#37314d" stroke-width="1" />
    <text x="150" y="20" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Controles: [◀ / ▶] Movimiento  •  [BARRA ESPACIO] Disparo</text>
  </g>
</svg>
