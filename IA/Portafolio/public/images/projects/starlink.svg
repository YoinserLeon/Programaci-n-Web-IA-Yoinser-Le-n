<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0b1325" />
      <stop offset="100%" stop-color="#2a1805" />
    </linearGradient>
    <linearGradient id="sunHorizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="satGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Space Background -->
  <rect width="800" height="500" fill="url(#spaceBg)" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="60" r="1.2" />
    <circle cx="150" cy="120" r="1.5" />
    <circle cx="230" cy="40" r="0.9" />
    <circle cx="340" cy="90" r="1.4" />
    <circle cx="450" cy="50" r="1.1" />
    <circle cx="560" cy="110" r="1.6" />
    <circle cx="680" cy="70" r="1.3" />
    <circle cx="750" cy="130" r="0.8" />
    <circle cx="120" cy="220" r="1" />
    <circle cx="280" cy="180" r="1.5" />
    <circle cx="620" cy="210" r="1.2" />
    <circle cx="710" cy="260" r="1.7" />
  </g>

  <!-- Earth Atmosphere Curved Horizon -->
  <path d="M -100 440 Q 400 340 900 440 L 900 500 L -100 500 Z" fill="#0c182b" />
  <path d="M -100 440 Q 400 340 900 440" stroke="url(#sunHorizon)" stroke-width="4" fill="none" opacity="0.9" filter="drop-shadow(0 0 15px #f59e0b)" />

  <!-- Constellation Orbit Lines -->
  <path d="M 50 180 Q 400 80 750 200" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4" fill="none" />
  <path d="M 80 280 Q 400 160 720 290" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3" fill="none" />

  <!-- Satellites -->
  <!-- Sat 1 -->
  <g transform="translate(240, 130)">
    <circle cx="0" cy="0" r="4" fill="#ffffff" filter="drop-shadow(0 0 6px #f59e0b)" />
    <rect x="-16" y="-2" width="12" height="4" rx="1" fill="#38bdf8" opacity="0.8" />
    <rect x="4" y="-2" width="12" height="4" rx="1" fill="#38bdf8" opacity="0.8" />
  </g>
  <!-- Sat 2 (Main) -->
  <g transform="translate(480, 120)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="drop-shadow(0 0 8px #f59e0b)" />
    <rect x="-22" y="-3" width="16" height="6" rx="1.5" fill="#f59e0b" opacity="0.9" />
    <rect x="6" y="-3" width="16" height="6" rx="1.5" fill="#f59e0b" opacity="0.9" />
    <line x1="0" y1="5" x2="-20" y2="40" stroke="#f59e0b" stroke-width="1" opacity="0.5" stroke-dasharray="2 2" />
    <line x1="0" y1="5" x2="20" y2="40" stroke="#f59e0b" stroke-width="1" opacity="0.5" stroke-dasharray="2 2" />
  </g>

  <!-- Browser Frame Overlaid -->
  <rect x="80" y="40" width="640" height="420" rx="14" fill="#090e18" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.8))" />

  <!-- Navigation Bar -->
  <rect x="80" y="40" width="640" height="42" rx="14" fill="#111827" fill-opacity="0.9" />
  <rect x="80" y="66" width="640" height="16" fill="#111827" fill-opacity="0.9" />
  
  <circle cx="105" cy="61" r="5" fill="#ef4444" />
  <circle cx="122" cy="61" r="5" fill="#f59e0b" />
  <circle cx="139" cy="61" r="5" fill="#10b981" />

  <text x="180" y="65" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="4">STARLINK</text>
  <text x="320" y="64" font-family="sans-serif" font-size="11" fill="#cbd5e1">RESIDENCIAL</text>
  <text x="420" y="64" font-family="sans-serif" font-size="11" fill="#94a3b8">EMPRESAS</text>
  <text x="510" y="64" font-family="sans-serif" font-size="11" fill="#94a3b8">ROAM</text>
  
  <rect x="610" y="50" width="90" height="24" rx="12" fill="url(#sunHorizon)" />
  <text x="655" y="66" font-family="sans-serif" font-weight="bold" font-size="10" fill="#0b0f19" text-anchor="middle">PEDIR AHORA</text>

  <!-- Hero Landing Content -->
  <g transform="translate(130, 130)">
    <rect width="180" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8" />
    <text x="90" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f59e0b" text-anchor="middle">INTERNET DE ALTA VELOCIDAD</text>

    <text x="0" y="65" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff">CONECTIVIDAD</text>
    <text x="0" y="102" font-family="sans-serif" font-weight="900" font-size="32" fill="#f59e0b">GLOBAL ORBITAL</text>

    <text x="0" y="132" font-family="sans-serif" font-size="12" fill="#94a3b8">Internet satelital de baja latencia diseñado para las ubicaciones</text>
    <text x="0" y="150" font-family="sans-serif" font-size="12" fill="#94a3b8">más remotas del planeta con cobertura 100% ininterrumpida.</text>

    <!-- Telemetry Cards -->
    <g transform="translate(0, 180)">
      <rect width="140" height="65" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="15" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">VELOCIDAD DESCARGA</text>
      <text x="15" y="50" font-family="sans-serif" font-weight="900" font-size="20" fill="#f59e0b">220 Mbps</text>

      <rect x="155" y="0" width="140" height="65" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="170" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">LATENCIA PROMEDIO</text>
      <text x="170" y="50" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff">24 ms</text>

      <rect x="310" y="0" width="140" height="65" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="325" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">SATÉLITES ACTIVOS</text>
      <text x="325" y="50" font-family="sans-serif" font-weight="900" font-size="20" fill="#f59e0b">6,000+</text>
    </g>
  </g>

  <!-- Dish Graphic on right -->
  <g transform="translate(600, 240)">
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="#1e293b" stroke="#f59e0b" stroke-width="2" transform="rotate(-25)" />
    <line x1="0" y1="0" x2="-20" y2="-60" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="-20" cy="-60" r="5" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)" />
    <rect x="-10" y="20" width="20" height="40" fill="#334155" />
    <rect x="-25" y="60" width="50" height="6" rx="3" fill="#64748b" />
  </g>
</svg>
